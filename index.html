}

/* ---------- Header fisso con lingue ---------- */

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:0 20px;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
}

.brand{
    display:flex;
    align-items:center;
    gap:8px;
    border:0;
    background:none;
    font:inherit;
    font-weight:700;
    font-size:1.05rem;
    color:var(--accent);
    cursor:pointer;
    white-space:nowrap;
}

.langs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
}

.langs::-webkit-scrollbar{display:none;}

.lang{
    flex:0 0 auto;
    width:40px;
    height:40px;
    border:3px solid #fff;
    border-radius:50%;
    background-color:#fff;
    background-size:cover;
    background-position:center;
    box-shadow:0 1px 5px rgba(0,0,0,.2);
    font-size:1.3rem;
    line-height:1;
    cursor:pointer;
    transition:transform .2s,border-color .2s;
}

.lang:hover{transform:scale(1.1);}
.lang.active{border-color:var(--accent);}

/* ---------- Hero ---------- */

.hero{
    min-height:55vh;
    display:flex;
    align-items:flex-end;
    padding:40px 20px;
    color:#fff;
    background-color:#3a4a5c;
    background-image:
        linear-gradient(to top,rgba(0,0,0,.65),rgba(0,0,0,.1)),
        url("images/hero-home.png");
    background-size:cover;
    background-position:center;
}

.hero-inner{
    width:100%;
    max-width:1100px;
    margin:0 auto;
}

.hero h1{
    font-size:clamp(2.2rem,7vw,4rem);
    line-height:1.1;
}

.hero p{
    margin-top:8px;
    font-size:clamp(1rem,2.5vw,1.3rem);
    opacity:.92;
}

/* ---------- Contenuto ---------- */

.container{
    max-width:1100px;
    margin:0 auto;
    padding:36px 20px 48px;
}

.intro{
    margin-bottom:24px;
    font-size:1.3rem;
    color:var(--muted);
    font-family: Arial, Helvetica, sans-serif;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:16px;
    background:rgba(242, 251, 252, 0.9);
}

.tile{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    min-height:130px;
    padding:20px 12px;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    color:var(--text);
    font-weight:600;
    text-align:center;
    text-decoration:none;
    transition:transform .2s,box-shadow .2s;
}

.tile:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 32px rgba(0,0,0,.12);
    
}

.tile-icon{font-size:4rem;}

.section-title{
    margin:44px 0 18px;
    font-size:2.5rem;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:14px;
}

.gallery img{
    width:100%;
    aspect-ratio:4/3;
    object-fit:cover;
    border-radius:14px;
    cursor:zoom-in;
}

.lightbox{
    position:fixed;
    inset:0;
    z-index:300;
    display:grid;
    place-items:center;
    padding:20px;
    background:rgba(0,0,0,.9);
    cursor:zoom-out;
}

.lightbox img{
    max-width:100%;
    max-height:90vh;
    border-radius:12px;
}

/* ---------- Footer e WhatsApp ---------- */

.footer{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:32px 20px 96px;
    background:#222;
    color:#ddd;
    text-align:center;
}

.wa-float{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:200;
    width:58px;
    height:58px;
    border:0;
    border-radius:50%;
    background:#25d366;
    color:#fff;
    font-size:1.7rem;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    cursor:pointer;
}

/* ---------- Mobile ---------- */

@media (max-width:760px){
    .topbar{padding:0 12px;}
    .brand-name{display:none;}
    .lang{width:36px;height:36px;}
    .hero{min-height:42vh;padding:28px 18px;}
    .dashboard{grid-template-columns:repeat(3,1fr);gap:10px;}
    .tile{min-height:104px;padding:14px 6px;font-size:.85rem;}
    .tile-icon{font-size:1.9rem;}
}

@media (max-width:380px){
    .dashboard{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
